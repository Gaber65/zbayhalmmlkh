name: Build iOS App

on:
  push:
    branches: [ '**' ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر من صفحة Actions على GitHub

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تهيئة بيئة Flutter المستقرة
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          cache: true

      # 3. تثبيت حزم المشروع
      - name: Install Dependencies
        run: |
          flutter pub get

      # 4. بناء تطبيق iOS بدون توقيع (تجاوز متطلب حساب المطور عبر xcodebuild)
      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install
          cd ..
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/ios_derived \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      # 5. حزم التطبيق في ملف IPA جاهز للاستخدام
      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r DhabayihLmamlaka.ipa Payload

      # 6. حفظ ملف الـ IPA كـ Artifact على GitHub لتحميله مباشرة
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhabayih-lmamlaka-ios
          path: DhabayihLmamlaka.ipa
          retention-days: 14
