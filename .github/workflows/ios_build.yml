name: Build iOS App

on:
  push:
    branches: [ '**' ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر من صفحة Actions على GitHub

jobs:
  build-ios:
    name: Build iOS IPA with Shorebird
    runs-on: macos-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تهيئة بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          cache: true

      # 3. تهيئة بيئة Shorebird CLI
      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      # 4. تثبيت الحزم ومكتبات CocoaPods
      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install
          cd ..

      # 5. بناء تطبيق iOS وتسجيله كـ Release في Shorebird
      - name: Build and Release iOS Application
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            echo "🚀 SHOREBIRD_TOKEN detected! Building Shorebird Release for iOS..."
            shorebird release ios --no-codesign
          else
            echo "⚠️ SHOREBIRD_TOKEN not found in secrets. Building standard unsigned release..."
            flutter build ios --release --no-codesign --config-only
            xcodebuild -workspace ios/Runner.xcworkspace \
                       -scheme Runner \
                       -configuration Release \
                       -destination 'generic/platform=iOS' \
                       -derivedDataPath build/ios_derived \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       clean build
          fi

      # 6. حزم التطبيق في ملف IPA جاهز للتثبيت
      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
          elif [ -d "build/ios_derived/Build/Products/Release-iphoneos/Runner.app" ]; then
            cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          else
            find build -name "Runner.app" -type d -exec cp -r {} Payload/ \;
          fi
          zip -r DhabayihLmamlaka.ipa Payload

      # 7. حفظ ملف الـ IPA كـ Artifact على GitHub
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhabayih-lmamlaka-ios
          path: DhabayihLmamlaka.ipa
          retention-days: 14
